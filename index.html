<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watch Movies (WM)</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="app-header">
      <div class="header-left">
        <button class="menu-btn">☰</button>
        <h1 class="app-title">WM Movies</h1>
      </div>
      <div class="header-right">
        <button id="header-register-btn" class="btn-small">Register</button>
        <button id="header-logout-btn" class="btn-small" style="display:none">Logout</button>
        <button class="logo-profile-btn">User</button>
      </div>
    </header>

    <main>
      <section id="welcome-screen" class="welcome-screen" style="display:none">
        <div id="welcome-auth-buttons">
          <button id="welcome-login-trigger">Iniciar sesión</button>
          <button id="welcome-register-trigger">Registrarse</button>
        </div>
        <div id="welcome-auth-form-wrapper" style="display:none">
          <label id="welcome-label-name">Nombre</label>
          <input id="welcome-auth-name" />
          <label id="welcome-label-email">Correo Electrónico</label>
          <input id="welcome-auth-email" />
          <label id="welcome-label-password">Contraseña</label>
          <input id="welcome-auth-password" type="password" />
          <div>
            <label><input type="checkbox" id="welcome-auth-remember"> Recordarme</label>
          </div>
          <button id="welcome-auth-submit">Enviar</button>
        </div>
      </section>

      <!-- Vistas principales (vacías; renderizadas por app.js) -->
      <section id="view-home" class="app-view"></section>
      <section id="view-explore" class="app-view"></section>
      <section id="view-likes" class="app-view"></section>
      <section id="view-mylist" class="app-view"></section>
      <section id="view-profile" class="app-view"></section>
      <section id="view-details" class="app-view"></section>
    </main>

    <nav class="app-nav">
      <button class="nav-btn" data-tab="home">Inicio</button>
      <button class="nav-btn" data-tab="explore">Explore</button>
      <button class="nav-btn" data-tab="likes">Likes</button>
      <button class="nav-btn" data-tab="mylist">My List</button>
      <button class="nav-btn" data-tab="profile">Perfil</button>
    </nav>

    <script type="module" src="app.js"></script>
  </body>
</html>
